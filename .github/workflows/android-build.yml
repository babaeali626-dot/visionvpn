name: Android Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        type: choice
        options: [debug, release]
        default: release
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Prepare Hiddify Core and Flutter code generation
        run: make android-prepare
      - name: Build split APKs
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "debug" ]]; then
            flutter build apk --debug --target lib/main.dart --split-per-abi
          else
            flutter build apk --release --target lib/main_prod.dart --split-per-abi
          fi
      - name: Generate SHA256 checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vision-vpn-${{ inputs.build_type }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30
