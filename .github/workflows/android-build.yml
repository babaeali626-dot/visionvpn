name: Build & Test VisionVPN Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  HIDDIFY_CORE_VERSION: "v5.9.15"
  LYREBIRD_VERSION: "lyrebird-0.5.0"
  SNOWFLAKE_VERSION: "v2.10.1"
  PSIPHON_TAG: "v2.0.43"
  TOR_ANDROID_VERSION: "0.4.9.17"
  ANDROID_NDK_VERSION: "30.0.16248370"
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.VISION_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK & NDK r30 (16 KB Default Alignment)
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370"

      - name: Set up Go required by Hiddify Core
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Node.js for Hiddify Core build tooling
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cache Hiddify Core AAR
        id: cache-hiddify-core
        uses: actions/cache@v6
        with:
          path: app/libs/hiddify-core.aar
          key: hiddify-core-android-${{ env.HIDDIFY_CORE_VERSION }}-go-1.27.3-ndk-${{ env.ANDROID_NDK_VERSION }}-16kb-v3

      - name: Build official Hiddify Core Android AAR with 16 KB page alignment
        if: steps.cache-hiddify-core.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export CGO_LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          mkdir -p app/libs
          rm -rf /tmp/hiddify-core
          # Hiddify Core v5.9.15 declares ray2sing with an SSH URL in .gitmodules.
          # GitHub-hosted runners have no SSH key for this public dependency, so use HTTPS.
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git clone --depth 1 --single-branch --recurse-submodules --branch "${HIDDIFY_CORE_VERSION}" https://github.com/hiddify/hiddify-core.git /tmp/hiddify-core
          echo "hiddify-core-commit=$(git -C /tmp/hiddify-core rev-parse HEAD)" >> /tmp/resolved-commits.txt
          cd /tmp/hiddify-core
          make android
          test -s bin/hiddify-core.aar
          cp bin/hiddify-core.aar "${GITHUB_WORKSPACE}/app/libs/hiddify-core.aar"

      - name: Verify Hiddify Core AAR API contract
        run: |
          set -euo pipefail
          test -s app/libs/hiddify-core.aar
          unzip -p app/libs/hiddify-core.aar classes.jar > /tmp/hiddify-core-classes.jar
          for class in \
            'com/hiddify/core/libbox/Libbox.class' \
            'com/hiddify/core/libbox/PlatformInterface.class' \
            'com/hiddify/core/libbox/StringIterator.class' \
            'com/hiddify/core/libbox/NetworkInterface.class' \
            'com/hiddify/core/libbox/NetworkInterfaceIterator.class' \
            'com/hiddify/core/mobile/Mobile.class' \
            'com/hiddify/core/mobile/SetupOptions.class'; do
            if ! jar tf /tmp/hiddify-core-classes.jar | grep -Fxq "$class"; then
              echo "Required Hiddify Core API class missing from AAR: $class" >&2
              exit 1
            fi
          done
          javap -classpath /tmp/hiddify-core-classes.jar com.hiddify.core.mobile.SetupOptions | grep -q 'setFixAndroidStack(boolean)'
          javap -classpath /tmp/hiddify-core-classes.jar com.hiddify.core.mobile.Mobile | grep -q 'setup(com.hiddify.core.mobile.SetupOptions, com.hiddify.core.libbox.PlatformInterface)'
          echo "Hiddify Core ${HIDDIFY_CORE_VERSION} AAR contains Mobile.setup, its SetupOptions and the Android stack workaround."

      - name: Build pinned Tor Pluggable Transports (lyrebird & snowflake) for all advertised ABIs
        run: |
          set -euo pipefail
          retry() {
            local max_attempts=5 delay=5 attempt=1 status=0
            until "$@"; do
              status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return "$status"
              fi
              echo "Command failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          download_go_mods() {
            local mod_dir="$1"
            if [[ ! -f "${mod_dir}/go.mod" ]]; then
              echo "ERROR: Expected go.mod missing in module root: ${mod_dir}" >&2
              return 2
            fi
            (
              cd "$mod_dir"
              local max_attempts=5 delay=5 attempt=1 out="" status=0
              while true; do
                if out=$(go mod download 2>&1); then
                  [[ -n "$out" ]] && echo "$out"
                  return 0
                else
                  status=$?
                fi
                echo "$out" >&2
                if grep -Eqi "no modules specified|go\.mod file not found|invalid go version|cannot find module" <<< "$out"; then
                  echo "Deterministic Go module error detected; aborting without retry." >&2
                  return "$status"
                fi
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "go mod download failed after ${attempt} attempts in ${mod_dir}" >&2
                  return "$status"
                fi
                echo "Transient go mod download failure (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
              done
            )
          }
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build_android_go() {
            local goarch="$1" output="$2" package="$3" extra_ldflags="${4:-}" target=""
            case "$goarch" in
              arm64) target="aarch64-linux-android" ;;
              arm)   target="armv7a-linux-androideabi" ;;
              amd64) target="x86_64-linux-android" ;;
              *) echo "Unsupported Android Go architecture: $goarch" >&2; return 2 ;;
            esac
            local cc="${NDK_BIN}/${target}26-clang"
            local cxx="${NDK_BIN}/${target}26-clang++"
            if [[ ! -x "$cc" || ! -x "$cxx" ]]; then
              echo "Android NDK compiler missing for $goarch: $cc" >&2
              return 2
            fi
            local ldflags="-s -w"
            if [[ -n "$extra_ldflags" ]]; then
              ldflags="${extra_ldflags} ${ldflags}"
            fi
            if [[ "$goarch" == "arm64" || "$goarch" == "amd64" ]]; then
              ldflags="${ldflags} -extldflags '-Wl,-z,max-page-size=16384'"
            fi
            echo "Building Android/$goarch with CGO and NDK compiler: $cc (ldflags: $ldflags)"
            if [[ "$goarch" == "arm" ]]; then
              CGO_ENABLED=1 CC="$cc" CXX="$cxx" GOOS=android GOARCH=arm GOARM=7 \
                go build -trimpath -ldflags="$ldflags" -o "$output" "$package"
            else
              CGO_ENABLED=1 CC="$cc" CXX="$cxx" GOOS=android GOARCH="$goarch" \
                go build -trimpath -ldflags="$ldflags" -o "$output" "$package"
            fi
          }
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64

          rm -rf /tmp/lyrebird
          retry git clone --depth 1 --single-branch --branch "${LYREBIRD_VERSION}" https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird.git /tmp/lyrebird
          echo "lyrebird-commit=$(git -C /tmp/lyrebird rev-parse HEAD)" >> /tmp/resolved-commits.txt
          download_go_mods /tmp/lyrebird
          cd /tmp/lyrebird
          build_android_go arm64 "${GITHUB_WORKSPACE}/app/src/main/jniLibs/arm64-v8a/liblyrebird.so" ./cmd/lyrebird
          build_android_go arm "${GITHUB_WORKSPACE}/app/src/main/jniLibs/armeabi-v7a/liblyrebird.so" ./cmd/lyrebird
          build_android_go amd64 "${GITHUB_WORKSPACE}/app/src/main/jniLibs/x86_64/liblyrebird.so" ./cmd/lyrebird

          # Snowflake v2.10.1 pulls in github.com/wlynxg/anet via pion/webrtc on Android
          # (workaround for Android 11+ NETLINK_ROUTE restrictions, golang/go#40569 & #68082).
          # anet uses //go:linkname net.zoneCache and officially requires -checklinkname=0 on Go 1.23+
          # (see github.com/wlynxg/anet#11). Scoped strictly to Snowflake only.
          rm -rf /tmp/snowflake
          retry git clone --depth 1 --single-branch --branch "${SNOWFLAKE_VERSION}" https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake.git /tmp/snowflake
          echo "snowflake-commit=$(git -C /tmp/snowflake rev-parse HEAD)" >> /tmp/resolved-commits.txt
          download_go_mods /tmp/snowflake
          cd /tmp/snowflake
          build_android_go arm64 "${GITHUB_WORKSPACE}/app/src/main/jniLibs/arm64-v8a/libsnowflake.so" ./client "-checklinkname=0"
          build_android_go arm "${GITHUB_WORKSPACE}/app/src/main/jniLibs/armeabi-v7a/libsnowflake.so" ./client "-checklinkname=0"
          build_android_go amd64 "${GITHUB_WORKSPACE}/app/src/main/jniLibs/x86_64/libsnowflake.so" ./client "-checklinkname=0"

      - name: Build pinned Psiphon tunnel-core for all advertised ABIs
        run: |
          set -euo pipefail
          retry() {
            local max_attempts=5 delay=5 attempt=1 status=0
            until "$@"; do
              status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return "$status"
              fi
              echo "Command failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          download_go_mods() {
            local mod_dir="$1"
            if [[ ! -f "${mod_dir}/go.mod" ]]; then
              echo "ERROR: Expected go.mod missing in module root: ${mod_dir}" >&2
              echo "Verify PSIPHON_TAG (${PSIPHON_TAG}) is a Go-module-enabled release." >&2
              return 2
            fi
            (
              cd "$mod_dir"
              local max_attempts=5 delay=5 attempt=1 out="" status=0
              while true; do
                if out=$(go mod download 2>&1); then
                  [[ -n "$out" ]] && echo "$out"
                  return 0
                else
                  status=$?
                fi
                echo "$out" >&2
                if grep -Eqi "no modules specified|go\.mod file not found|invalid go version|cannot find module" <<< "$out"; then
                  echo "Deterministic Go module error detected; aborting without retry." >&2
                  return "$status"
                fi
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "go mod download failed after ${attempt} attempts in ${mod_dir}" >&2
                  return "$status"
                fi
                echo "Transient go mod download failure (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
              done
            )
          }
          # Psiphon tunnel-core's psiphon-tls requires the exact Go toolchain declared in its go.mod.
          # Enabling GOTOOLCHAIN=auto strictly in this step ensures Go fetches the matching toolchain
          # without altering Go 1.23 used by Sing-box, Lyrebird, and Snowflake.
          export GOTOOLCHAIN=auto
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build_android_go() {
            local goarch="$1" output="$2" package="$3" extra_ldflags="${4:-}" target=""
            case "$goarch" in
              arm64) target="aarch64-linux-android" ;;
              arm)   target="armv7a-linux-androideabi" ;;
              amd64) target="x86_64-linux-android" ;;
              *) echo "Unsupported Android Go architecture: $goarch" >&2; return 2 ;;
            esac
            local cc="${NDK_BIN}/${target}26-clang"
            local cxx="${NDK_BIN}/${target}26-clang++"
            if [[ ! -x "$cc" || ! -x "$cxx" ]]; then
              echo "Android NDK compiler missing for $goarch: $cc" >&2
              return 2
            fi
            local ldflags="-s -w"
            if [[ -n "$extra_ldflags" ]]; then
              ldflags="${extra_ldflags} ${ldflags}"
            fi
            if [[ "$goarch" == "arm64" || "$goarch" == "amd64" ]]; then
              ldflags="${ldflags} -extldflags '-Wl,-z,max-page-size=16384'"
            fi
            echo "Building Psiphon ConsoleClient Android/$goarch with CGO and NDK compiler: $cc (ldflags: $ldflags)"
            if [[ "$goarch" == "arm" ]]; then
              CGO_ENABLED=1 CC="$cc" CXX="$cxx" GOOS=android GOARCH=arm GOARM=7 \
                go build -trimpath -ldflags="$ldflags" -o "$output" "$package"
            else
              CGO_ENABLED=1 CC="$cc" CXX="$cxx" GOOS=android GOARCH="$goarch" \
                go build -trimpath -ldflags="$ldflags" -o "$output" "$package"
            fi
          }
          rm -rf /tmp/psiphon
          retry git clone --depth 1 --single-branch --branch "${PSIPHON_TAG}" https://github.com/Psiphon-Labs/psiphon-tunnel-core.git /tmp/psiphon
          echo "psiphon-commit=$(git -C /tmp/psiphon rev-parse HEAD)" >> /tmp/resolved-commits.txt

          # Detect module root explicitly (Psiphon v2.0.43 has root-level go.mod)
          if [[ -f /tmp/psiphon/go.mod ]]; then
            PSIPHON_MOD_ROOT="/tmp/psiphon"
            PSIPHON_PKG="./ConsoleClient"
          elif [[ -f /tmp/psiphon/ConsoleClient/go.mod ]]; then
            PSIPHON_MOD_ROOT="/tmp/psiphon/ConsoleClient"
            PSIPHON_PKG="."
          else
            echo "ERROR: Neither /tmp/psiphon/go.mod nor /tmp/psiphon/ConsoleClient/go.mod exists for tag ${PSIPHON_TAG}." >&2
            exit 2
          fi
          echo "Detected Psiphon Go module root: ${PSIPHON_MOD_ROOT} (go directive: $(grep -E '^(go|toolchain) ' "${PSIPHON_MOD_ROOT}/go.mod" | tr '\n' ' '))"
          download_go_mods "${PSIPHON_MOD_ROOT}"
          cd "${PSIPHON_MOD_ROOT}"
          echo "Active Go toolchain for Psiphon: $(go version)"
          echo "Resolved anet dependency (if present): $(go list -m github.com/wlynxg/anet 2>/dev/null || echo 'not listed')"

          # Psiphon v2.0.43 pulls in github.com/wlynxg/anet via its pion/webrtc in-proxy stack on Android
          # (workaround for Android 11+ NETLINK_ROUTE restrictions, golang/go#40569 & #68082).
          # anet uses //go:linkname net.zoneCache, rejected by default on Go 1.23+ (including current Go toolchains);
          # see github.com/wlynxg/anet#11. Scoped strictly to Psiphon ConsoleClient builds.
          build_android_go arm64 "${GITHUB_WORKSPACE}/app/src/main/jniLibs/arm64-v8a/libpsiphon.so" "${PSIPHON_PKG}" "-checklinkname=0"
          build_android_go arm "${GITHUB_WORKSPACE}/app/src/main/jniLibs/armeabi-v7a/libpsiphon.so" "${PSIPHON_PKG}" "-checklinkname=0"
          build_android_go amd64 "${GITHUB_WORKSPACE}/app/src/main/jniLibs/x86_64/libpsiphon.so" "${PSIPHON_PKG}" "-checklinkname=0"

      - name: Assert ELF Architectures, Verify Mandatory Binaries & Generate SBOM/Provenance
        run: |
          set -euo pipefail
          test -s app/libs/hiddify-core.aar
          declare -A EXPECTED_ARCH=(
            ["arm64-v8a"]="AArch64"
            ["armeabi-v7a"]="ARM"
            ["x86_64"]="X86-64"
          )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for bin in liblyrebird.so libsnowflake.so libpsiphon.so; do
              path="app/src/main/jniLibs/${abi}/${bin}"
              test -s "${path}"
              chmod +x "${path}"
              readelf -h "${path}" | grep -q "${EXPECTED_ARCH[$abi]}"
            done
          done
          {
            echo "hiddify-core=${HIDDIFY_CORE_VERSION}"
            echo "lyrebird=${LYREBIRD_VERSION}"
            echo "snowflake=${SNOWFLAKE_VERSION}"
            echo "psiphon=${PSIPHON_TAG}"
            echo "tor-android=${TOR_ANDROID_VERSION}"
            echo "ndk=${ANDROID_NDK_VERSION}"
            if [ -f /tmp/resolved-commits.txt ]; then
              cat /tmp/resolved-commits.txt
            fi
            sha256sum app/libs/hiddify-core.aar app/src/main/jniLibs/*/*.so
          } | tee build-provenance.txt
          cat > sbom-components.json <<EOF
          {
            "bomFormat": "VisionVPN-SBOM",
            "components": [
              {"name": "hiddify-core", "version": "${HIDDIFY_CORE_VERSION}", "license": "GPL-3.0-or-later"},
              {"name": "tor-android", "version": "${TOR_ANDROID_VERSION}", "license": "BSD-3-Clause"},
              {"name": "lyrebird", "version": "${LYREBIRD_VERSION}", "license": "BSD-3-Clause"},
              {"name": "snowflake", "version": "${SNOWFLAKE_VERSION}", "license": "BSD-3-Clause"},
              {"name": "psiphon-tunnel-core", "version": "${PSIPHON_TAG}", "license": "GPL-3.0-or-later"}
            ]
          }
          EOF

      - name: Setup Gradle (or use verified ./gradlew when gradle-wrapper.jar is committed)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Run Automated Unit Tests
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            gradle testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Build Signed Production Release APK (when CI secrets configured)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          VISION_KEYSTORE_PATH: /tmp/vision-release.jks
          VISION_KEYSTORE_BASE64: ${{ secrets.VISION_KEYSTORE_BASE64 }}
          VISION_KEYSTORE_PASSWORD: ${{ secrets.VISION_KEYSTORE_PASSWORD }}
          VISION_KEY_ALIAS: ${{ secrets.VISION_KEY_ALIAS }}
          VISION_KEY_PASSWORD: ${{ secrets.VISION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$VISION_KEYSTORE_BASE64" | base64 --decode > "${VISION_KEYSTORE_PATH}"
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Build Unsigned Release APK (Test-Only Validation when secrets absent)
        if: ${{ env.HAS_RELEASE_KEYSTORE != 'true' }}
        run: |
          set -euo pipefail
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease -Pvision.allowUnsignedRelease=true --no-daemon --stacktrace
          else
            gradle assembleRelease -Pvision.allowUnsignedRelease=true --no-daemon --stacktrace
          fi
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "${UNSIGNED_APK}" ]; then
            "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -P 16 -f 4 "${UNSIGNED_APK}" "${UNSIGNED_APK}.aligned"
            mv "${UNSIGNED_APK}.aligned" "${UNSIGNED_APK}"
          fi

      - name: Verify 16 KB ELF PT_LOAD, GNU_RELRO, and APK ZIP Alignment Across ALL Built APKs and ALL Packaged ABIs
        run: |
          set -euo pipefail
          test -f scripts/verify_16kb_alignment.py
          python3 -m unittest scripts/test_verify_16kb_alignment.py -v
          python3 scripts/verify_16kb_alignment.py

      - name: Upload 16 KB Diagnostic Report on Verification Failure
        if: failure() && hashFiles('16kb-alignment-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: VisionVPN-16KB-Alignment-Failure-Report
          path: 16kb-alignment-report.json
          retention-days: 7

      - name: Upload Debug, SBOM, 16 KB Report & Provenance Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VisionVPN-Debug-APK
          path: |
            build-provenance.txt
            sbom-components.json
            16kb-alignment-report.json
            app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Signed Production Release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: VisionVPN-Production-Signed-Release-APK
          path: |
            build-provenance.txt
            sbom-components.json
            16kb-alignment-report.json
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Unsigned Release APK (Explicitly Labeled Test-Only)
        if: ${{ always() && env.HAS_RELEASE_KEYSTORE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: VisionVPN-Release-UNSIGNED-TEST-ONLY
          path: |
            build-provenance.txt
            sbom-components.json
            16kb-alignment-report.json
            app/build/outputs/apk/release/*.apk
          retention-days: 7
