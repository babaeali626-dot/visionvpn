name: Android Release
on:
  push:
    tags: ['vision-v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (for example vision-v0.1.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Prepare sources and Core
        run: make android-prepare
      - name: Run analysis and tests before release
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          (cd packages/vision_tor && flutter test)
          python3 scripts/check_tor_notices.py
      - name: Build release APKs
        run: flutter build apk --release --target lib/main_prod.dart --split-per-abi
      - name: Sign release APKs (required)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required for release signing.' >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vision-release.jks"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/vision-release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "env:ANDROID_KEY_PASSWORD" "$apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify "$apk"
          done
      - name: Checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vision-vpn-release-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 90
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/SHA256SUMS.txt             --title "Vision VPN $TAG" --generate-notes
