name: Test branch - dispatch full Android build

on:
  push:
    branches: [ test ]
    paths:
      - '.github/workflows/test-branch-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: visionvpn-test-branch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-full-build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the full build workflow exists on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow view android-build.yml --ref test --yaml

      - name: Dispatch the full Android build on branch test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run android-build.yml --ref test
          echo "Dispatched the full Android CI workflow on ref test."
