name: VisionVPN Android CI & Release APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visionvpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci-and-apk:
    name: Test, Build Tor Transports & Package Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
      GOTOOLCHAIN: 'auto'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space for NDK, Flutter and Gradle build
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go 1.24 for Core tests and Tor Pluggable Transports
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: hiddify-core/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Prevent setup-android from requesting the removed legacy 'tools' package.
          packages: platform-tools

      - name: Install Android SDK platform, build tools and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Build Tor Pluggable Transports (Snowflake & obfs4/lyrebird) for Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_tor_transports.sh
          bash scripts/build_tor_transports.sh
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "android/app/src/main/jniLibs/${abi}/liblyrebird.so"
            test -s "android/app/src/main/jniLibs/${abi}/libsnowflake.so"
          done

      - name: Prepare official Hiddify Core v5.9.15 Android AAR
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL=prod make android-libs
          ls -lh android/app/libs/
          test -n "$(find android/app/libs -maxdepth 1 -type f -name '*.aar' -size +0c -print -quit)"

      - name: Run Go Core Tor-mode security & regression unit tests
        working-directory: hiddify-core
        run: go test -v ./v2/config/...

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate Dart and localization code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Analyze Flutter & Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tor security & lifecycle tests
        run: flutter test --no-pub test/features/tor/

      - name: Run full Flutter test suite
        run: flutter test --no-pub

      - name: Configure Gradle Google Maven Central mirror (bypass plugins.gradle.org -> Maven Central 429)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.gradle/init.d"
          cat << 'GRADLE_EOF' > "${HOME}/.gradle/init.d/maven-mirror.gradle"
          def googleMirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"
          def rewriteMavenCentral = { RepositoryHandler repos ->
              repos.all { ArtifactRepository repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def url = repo.url.toString()
                      if (url.startsWith("https://repo.maven.apache.org/maven2") ||
                          url.startsWith("https://repo1.maven.org/maven2")) {
                          repo.setUrl(googleMirrorUrl)
                      }
                  }
              }
          }
          beforeSettings { settings ->
              rewriteMavenCentral(settings.pluginManagement.repositories)
              rewriteMavenCentral(settings.dependencyResolutionManagement.repositories)
          }
          allprojects {
              buildscript {
                  rewriteMavenCentral(repositories)
              }
              rewriteMavenCentral(repositories)
          }
          GRADLE_EOF

          # Ensure Flutter's included :gradle build resolves Kotlin/Maven artifacts from Google's
          # mirror BEFORE gradlePluginPortal() (which 302-redirects to rate-limited repo.maven.apache.org).
          FLUTTER_GRADLE_DIR="${FLUTTER_ROOT}/packages/flutter_tools/gradle"
          for kts in "${FLUTTER_GRADLE_DIR}/settings.gradle.kts" "${FLUTTER_GRADLE_DIR}/build.gradle.kts"; do
            if [[ -f "${kts}" ]]; then
              python3 - "${kts}" << 'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          mirror = 'maven(url = "https://maven-central.storage-download.googleapis.com/maven2")\n        gradlePluginPortal()'
          if "maven-central.storage-download.googleapis.com" not in text and "gradlePluginPortal()" in text:
              text = text.replace("gradlePluginPortal()", mirror)
              p.write_text(text, encoding="utf-8")
              print(f"Patched {p} to check Google Maven mirror before gradlePluginPortal()")
          PYEOF
            fi
          done

      - name: Remove duplicate legacy Hiddify webp launcher icons
        shell: bash
        run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.webp \
                android/app/src/main/res/mipmap-*/ic_launcher_round.webp

      - name: Build Android release APKs (per-ABI and universal)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "==> Gradle APK build attempt ${attempt}/3"
            if flutter build apk --release --split-per-abi --no-pub; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Build attempt ${attempt} failed; waiting 20s before retry..."
              sleep 20
            fi
          done
          exit 1

      - name: Verify APK outputs and packaged Tor transport binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apks
          ls -lh build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do
            case "$(basename "$f")" in
              *arm64-v8a*)   cp "$f" dist-apks/VisionVPN-Android-arm64-v8a.apk ;;
              *armeabi-v7a*) cp "$f" dist-apks/VisionVPN-Android-armeabi-v7a.apk ;;
              *x86_64*)      cp "$f" dist-apks/VisionVPN-Android-x86_64.apk ;;
              *universal*|app-release.apk) cp "$f" dist-apks/VisionVPN-Android-universal.apk ;;
              *)             cp "$f" "dist-apks/$(basename "$f")" ;;
            esac
          done
          ls -lh dist-apks/
          test -s dist-apks/VisionVPN-Android-arm64-v8a.apk
          # Verify real Snowflake and obfs4 (lyrebird) binaries are packaged inside the arm64 APK.
          unzip -l dist-apks/VisionVPN-Android-arm64-v8a.apk | grep -q "lib/arm64-v8a/libtor.so"
          unzip -l dist-apks/VisionVPN-Android-arm64-v8a.apk | grep -q "lib/arm64-v8a/libsnowflake.so"
          unzip -l dist-apks/VisionVPN-Android-arm64-v8a.apk | grep -q "lib/arm64-v8a/liblyrebird.so"
          echo "Verified Snowflake and obfs4 binaries inside built APK."

      - name: Upload Vision VPN Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: visionvpn-android-apks-${{ github.run_number }}
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 14
