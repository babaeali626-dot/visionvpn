name: vision_tor_plugin
description: Native Tor engine bridge and Vision VPN Tor UI module for Android.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8
flutter:
  plugin:
    platforms:
      android:
        package: net.visionvpn.tor
        pluginClass: VisionTorPlugin
  assets:
    - assets/vision_vpn_logo.png
